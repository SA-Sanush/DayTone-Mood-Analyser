services:
  - type: web
    name: daytone
    runtime: python
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn "app:create_app()" --workers 2 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT --preload
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false          # Set manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: daytone-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          name: daytone-redis
          type: redis
          property: connectionString
      - key: ADMIN_REGISTRATION_CODE
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"

  - type: redis
    name: daytone-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: daytone-db
    plan: free
    databaseName: daytone
    user: daytone
