{% extends "base.html" %}
{% block title %}Users - DayTone{% endblock %}
{% block content %}
<div class="page-head"><div><span class="eyebrow">People</span><h1>Users</h1></div></div>
<div class="panel table-responsive elevated-panel">
  <table class="table align-middle">
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th></th></tr></thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>{{ user.created_at.strftime("%Y-%m-%d") }}</td>
        <td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('admin.user_detail', user_id=user.id) }}">View</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
